name: Build

permissions:
  contents: write

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  linux_build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libudev-dev
    - name: Build
      run: cargo build --release

    - shell: bash
      run: |
        mv target/release/redragon redragon
        chmod 777 redragon
        tar cpfz redragon_linux_x86_64.tar.gz redragon

    - name: Release
      uses: softprops/action-gh-release@v1
      with:
        files: redragon_linux_x86_64.tar.gz
